name: "Homelab Dashboard"
description: "Homelab dashboard with service status and app stats, in the Home Assistant sidebar"
version: "0.1.0"
slug: "homelab"
url: "https://github.com/zaydons/ha-repository/tree/main/homelab"
arch:
  - amd64
  - aarch64
stage: experimental
ingress: true
panel_icon: "mdi:view-dashboard-variant"
panel_title: "Homelab"
# Supervisor defaults, left out because the app linter rejects defaults:
# init true, ingress_port 8099, panel_admin true (panel for admins only).
# Health: the Dockerfile HEALTHCHECK (the watchdog option is obsolete).
map:
  # Needed to seed the sample files; the app never edits user files after that.
  - type: app_config
    read_only: false
# Matched with Path.match against paths under /data (cache depth is 2).
backup_exclude:
  - "icon-cache"
  - "icon-cache/*"
  - "icon-cache/*/*"
options:
  log_level: info
schema:
  log_level: "list(debug|info|warning|error)"
